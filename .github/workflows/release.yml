# Pushing a tag vX.Y.Z publishes a GitHub release with BattleMarks-vX.Y.Z.zip, the addon in a
# BattleMarks/ folder. The tag must match "## Version" in BattleMarks.toc.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the .toc version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "## Version: ${version}" BattleMarks.toc; then
            echo "Tag ${GITHUB_REF_NAME} does not match BattleMarks.toc:"
            grep "## Version" BattleMarks.toc
            exit 1
          fi

      - name: Package
        run: git archive --format=zip --prefix=BattleMarks/ -o "BattleMarks-${GITHUB_REF_NAME}.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          files: BattleMarks-${{ github.ref_name }}.zip
          generate_release_notes: true
